# Objetivo: publicar a demonstração estática da pasta docs/ no GitHub Pages.
name: Publicar demonstração no GitHub Pages

# Dispara após alterações na branch principal ou por execução manual no GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Autoriza leitura do código e a autenticação necessária para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Mantém uma fila única para evitar publicações concorrentes da demonstração.
concurrency:
  group: pages
  cancel-in-progress: false

# Prepara o ambiente, empacota docs/ e envia o artefato à hospedagem estática.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Obtém os arquivos da revisão que disparou a publicação.
      - name: Baixar repositório
        uses: actions/checkout@v4

      # Prepara a integração do repositório com o serviço GitHub Pages.
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Empacota apenas a demonstração; o backend Flask não é executado no Pages.
      - name: Empacotar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      # Publica o artefato e fornece a URL resultante ao ambiente do GitHub.
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
