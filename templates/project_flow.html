      <article class="business-panel business-generation">
        <header><span class="business-number">1</span><h3>Geração de energia</h3></header>
        <p>A usina solar comunitária gera eletricidade (kWh).</p>
        <svg class="business-panel-art" viewBox="0 0 300 120" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M43 32H222L241 95H23L43 32Z" fill="currentColor" fill-opacity=".06"/><path d="M89 33L82 94M133 33V94M178 33L185 94M37 53H229M30 75H235M72 96V113M192 96V113M59 114H86M178 114H205"/><circle cx="264" cy="23" r="12"/><path d="M264 5V1M264 45V41M246 23H242M286 23H282M252 11L249 8M279 38L276 35" stroke-linecap="round"/></g></svg>
      </article>
      <div class="business-label business-energy-label">Energia injetada<br>na rede (kWh)</div>

      <article class="business-panel business-grid">
        <header><span class="business-number">2</span><h3>Cálculo e rastreamento</h3></header>
        <p>A concessionária de energia elétrica recebe a energia da usina na rede, rastreia os kWh injetados e calcula, para cada família, o valor correspondente ao consumo de energia do painel solar (rateio).</p>
        <svg class="business-grid-art" viewBox="0 0 280 105" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M30 100V14M11 29H48M17 23V34M42 23V34M15 37Q58 58 91 36M245 99V17M229 31H263M235 25V36M256 25V36M207 38Q225 47 239 37"/><path d="M81 100V40H207V100M77 100H214" fill="currentColor" fill-opacity=".05"/><path d="M97 56H190M116 100V75H144V100"/><rect x="155" y="75" width="34" height="13" rx="2"/></g></svg>
        <div class="business-bill"><span>CONTA DE ENERGIA</span><small>Valor referente ao consumo do painel solar (rateio)</small><strong>R$ X</strong><i aria-hidden="true"></i></div>
      </article>
      <div class="business-label business-reference-label">Conta de energia<br>(valor R$ X)</div>

      <article class="business-panel business-payment">
        <header><span class="business-number">3</span><h3>Pagamento ao Banco Comunitário Jardim Botânico</h3></header>
        <p>A família paga apenas metade do valor R$ X (<strong>R$ X/2</strong>) ao Banco Comunitário Jardim Botânico, via boleto ou outro meio de pagamento.</p>
        <div class="business-formula"><span>Valor pago</span><strong>R$ X/2</strong></div>
      </article>

      <article class="business-panel business-split">
        <header><span class="business-number">4</span><h3>Divisão do valor recebido (R$ X/2)</h3></header>
        <p>O valor pago pelas famílias (<strong>R$ X/2</strong>) é dividido em duas partes iguais:</p>
        <div class="business-split-total">R$ X/2</div>
        <svg class="business-branches" viewBox="0 0 400 38" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M200 0V10H65V32M65 32L59 25M65 32L71 25" stroke="#a7e3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 10H335V32M335 32L329 25M335 32L341 25" stroke="#fcd78b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="business-split-destinations">
          <div class="business-fund"><h4>25% de <span class="business-money-unit">R$ X</span><br><span>para o fundo</span></h4><svg viewBox="0 0 80 60" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5"><ellipse cx="29" cy="17" rx="17" ry="6"/><path d="M12 17V42C12 50 46 50 46 42V17M12 25C12 33 46 33 46 25M12 34C12 42 46 42 46 34M43 31C43 23 71 23 71 31V49C71 57 43 57 43 49V31M43 40C43 48 71 48 71 40"/></g></svg><p>O fundo possibilita o intercâmbio da moeda social Orquídea Solar com reais. O retorno à família é cashback em Orquídeas.</p><strong>R$ X/4</strong><small>FUNDO<br>Orquídea Solar</small></div>
          <div class="business-operation"><h4>25% de <span class="business-money-unit">R$ X</span><br><span>para o banco</span></h4><svg viewBox="0 0 80 60" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5"><ellipse cx="29" cy="17" rx="17" ry="6"/><path d="M12 17V42C12 50 46 50 46 42V17M12 25C12 33 46 33 46 25M12 34C12 42 46 42 46 34M43 31C43 23 71 23 71 31V49C71 57 43 57 43 49V31M43 40C43 48 71 48 71 40"/></g></svg><p>Fica com o Banco Comunitário como receita para manutenção, cobertura de custos operacionais, entre outros.</p><strong>R$ X/4</strong><small>BANCO COMUNITÁRIO<br>Jardim Botânico</small></div>
        </div>
      </article>

      <article class="business-panel business-commerce">
        <header><span class="business-number">5</span><h3>Uso da moeda social na comunidade</h3></header>
        <p>A família recebe cashback equivalente a X/4 em Orquídea Solar e o utiliza no comércio da comunidade. Esse cashback circula em moeda social, não em reais.</p>
        <svg class="business-commerce-art" viewBox="0 0 420 105" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M20 43L30 20H125L135 43H20ZM25 44V96H130V44M39 21L35 43M62 21L60 43M85 21L87 43M110 21L116 43M64 96V67H91V96"/><rect x="37" y="59" width="18" height="23" rx="2"/><path d="M153 41L164 12H253L264 41H153ZM158 42V96H259V42M172 13L168 41M195 13L193 41M219 13L222 41M243 13L249 41M194 96V64H221V96"/><rect x="177" y="53" width="14" height="17" rx="2"/><path d="M283 43L293 20H389L400 43H283ZM288 44V96H395V44M306 21L302 43M330 21L328 43M354 21L357 43M379 21L385 43M329 96V67H355V96M13 98H405"/></g></svg>
      </article>
      <div class="business-label business-cashback-label">Cashback em<br>Orquídea Solar <strong>X/4 em Orquídeas</strong></div>
